<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>나의 소개</title>
<style>
  h3 { text-align: center; }
  .photo {
    display: none;
    margin: 10px 0;
  }
  .name-hover:hover + .photo {
    display: block;
  }
</style>
</head>
<body>
<h3><span class="name-hover">서하영</span>
<div class="photo">
  <img src="shrek.jpg" width="150" alt="프로필 사진">
</div>
</h3>
<hr>
<p>
저는 대한민국에서 태어나서 컴퓨터 공학을 전공하는 학생입니다. 
제가 제일 좋아하는 과목은 웹 프로그래밍이고, 그 중에서도 자바스크립트를 제일 잘합니다.
</p>
</body>
</html>

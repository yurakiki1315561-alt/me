<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>표에 이미지 삽입</title></head>
<body>
<h3>표에 이미지 삽입</h3>
<hr>        디폴트 굵기(0)로 하여 테두리 제거.
<table>     굵기 조절은 CSS3(5장 3절)로 하는 것이 바람직

<caption>좋아하는 과일</caption>
<tbody>
<tr>
<td><img src="media/apple.jpg"></td>
<td><img src="media/banana.jpg"></td>
<td><img src="media/mango.jpg"></td>
</tr>
이미지들은 HTML 파일이 있는
</tbody>                경로 아래 media 폴더를 만들고
</table>                  그 곳에 두면 된다.
</body>
</html>

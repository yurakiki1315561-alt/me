<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>소프트웨어 기술 선호도에 관한 설문</title>
    <link href="survey5.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>설문지</h1>
      <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    </header>

    <section>
      <form action="http://www.webprogramming.co.kr/submit" method="post">
        <article>
          <span class="question">학년</span>
          <label><input type="radio" name="grade" value="1" checked />1학년</label>
          <label><input type="radio" name="grade" value="2" />2학년</label>
          <label><input type="radio" name="grade" value="3" />3학년</label>
          <label><input type="radio" name="grade" value="4" />4학년</label>
        </article>

        <article>
          <span class="question">성별</span>
          <label><input type="radio" name="gender" value="male" />남</label>
          <label><input type="radio" name="gender" value="female" />여</label>
        </article>

        <article>
          <label class="question" for="field">관심 분야</label>
          <select id="field" name="field">
            <option value="mobile">모바일 소프트웨어</option>
            <option value="web">웹 소프트웨어</option>
            <option value="ai">인공지능</option>
            <option value="game">게임</option>
            <option value="security">정보 보안</option>
          </select>
        </article>

        <article>
          <span class="question">진로</span>
          <label><input type="checkbox" name="career" value="dev" checked />개발</label>
          <label><input type="checkbox" name="career" value="plan" />기획</label>
          <label><input type="checkbox" name="career" value="sales" />영업</label>
          <label><input type="checkbox" name="career" value="startup" />창업</label>
        </article>

        <article class="comment">
          <label class="question" for="comment">남기고 싶은 말</label>
          <textarea
            id="comment"
            name="comment"
            rows="6"
            cols="50"
            placeholder="글을 남겨주세요"
          ></textarea>
        </article>

        <article>
          <input type="submit" value="제출" />
          <input type="reset" value="다시 작성" />
        </article>
      </form>
    </section>

    <footer>
      <p>Copyright 2022 by Kitae</p>
    </footer>
  </body>
</html>
